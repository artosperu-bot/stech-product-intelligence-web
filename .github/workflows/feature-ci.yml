name: Feature CI

on:
  push:
    branches:
      - feat/resilient-batch-research
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Restore legacy core used by production image
        run: |
          cat legacy_core_bundle_v2/part-*.b64 | base64 -d > /tmp/legacy_core.tar.gz
          tar -xzf /tmp/legacy_core.tar.gz -C .
          test -f backend/legacy_core/chatgpt_browser.py
      - name: Run focused resilient batch tests
        env:
          PYTHONPATH: backend:backend/legacy_core
        run: |
          python -m unittest backend.tests.test_job_store_lifecycle -v
          python -m unittest backend.tests.test_characteristics_batch_state -v
